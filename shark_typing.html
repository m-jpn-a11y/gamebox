<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>サメのタイピングゲーム</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
    background: linear-gradient(180deg, #0b3d6b 0%, #0a2a4d 100%);
    color: #fff;
    overflow: hidden;
    user-select: none;
  }

  /* ヘッダー */
  #header {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: center;
    padding: 18px 32px;
    font-size: 22px; font-weight: bold;
    background: none; border: none;
  }
  #time-area { display: flex; align-items: center; gap: 14px; }
  #time-bar {
    width: 260px; height: 18px;
    background: rgba(255,255,255,0.15);
    border-radius: 9px; overflow: hidden;
  }
  #time-fill {
    height: 100%; width: 50%;
    background: #ffd700;
    border-radius: 9px;
    transition: width 0.1s linear;
  }
  #time-text { min-width: 60px; }
  #score-area { font-size: 24px; }

  /* メイン */
  #main {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .shark {
    position: absolute; top: 50%;
    transform: translateY(-50%);
    width: 22vw; max-width: 300px; min-width: 120px;
    border-radius: 20px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    object-fit: cover;
  }
  #shark-left  { left: 3vw; }
  #shark-right { right: 3vw; }
  .shark.bounce { animation: bounce 0.5s ease; }
  @keyframes bounce {
    0%   { transform: translateY(-50%) scale(1); }
    30%  { transform: translateY(-50%) scale(1.15) rotate(-3deg); }
    60%  { transform: translateY(-50%) scale(1.1) rotate(3deg); }
    100% { transform: translateY(-50%) scale(1); }
  }

  #center {
    text-align: center;
    width: 46vw; min-width: 320px;
    z-index: 2;
  }
  #japanese {
    font-size: clamp(36px, 6vw, 84px);
    font-weight: bold;
    margin-bottom: 24px;
    text-shadow: 0 3px 10px rgba(0,0,0,0.5);
    min-height: 1.3em;
  }
  #romaji {
    font-size: clamp(24px, 3.6vw, 48px);
    letter-spacing: 0.08em;
    font-family: "Consolas", "Courier New", monospace;
    min-height: 1.3em;
  }
  #romaji .done { color: #ffd700; }
  #romaji .rest { color: #ffffff; }
  #romaji.miss { animation: shake 0.15s; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }

  #message {
    font-size: clamp(22px, 3vw, 36px);
    line-height: 1.7;
    text-shadow: 0 2px 8px rgba(0,0,0,0.5);
  }
  #message .big { font-size: 1.6em; color: #ffd700; font-weight: bold; }
  #message .sub { font-size: 0.7em; opacity: 0.85; }
  #countdown {
    font-size: clamp(80px, 14vw, 200px);
    font-weight: bold; color: #ffd700;
    text-shadow: 0 4px 16px rgba(0,0,0,0.5);
  }
  .hidden { display: none !important; }

  /* +秒 演出 */
  #bonus {
    position: absolute; top: 70px; left: 32px;
    font-size: 26px; font-weight: bold; color: #7CFC9A;
    opacity: 0; pointer-events: none;
  }
  #penalty {
    position: absolute; top: 70px; left: 32px;
    font-size: 26px; font-weight: bold; color: #ff6b6b;
    opacity: 0; pointer-events: none;
  }
  #penalty.show { animation: bonusFade 0.7s ease-out; }
  #bonus.show { animation: bonusFade 0.9s ease-out; }
  @keyframes bonusFade {
    0%   { opacity: 0; transform: translateY(10px); }
    20%  { opacity: 1; }
    100% { opacity: 0; transform: translateY(-14px); }
  }
</style>
</head>
<body>

<div id="header">
  <div id="time-area">
    <span>time:</span>
    <div id="time-bar"><div id="time-fill"></div></div>
    <span id="time-text">30秒</span>
  </div>
  <div id="score-area">score: <span id="score">0</span>点</div>
</div>
<div id="bonus">+5秒</div>
<div id="penalty">-2秒</div>

<div id="main">
  <!-- 画像は下のJSの SHARK_NORMAL_SRC / SHARK_SURPRISED_SRC で差し替え可能 -->

    <div id="message"></div>
    <div id="countdown" class="hidden"></div>
    <div id="game-view" class="hidden">
      <div id="japanese"></div>
      <div id="romaji"></div>
    </div>
  </div>
  <img id="shark-right" class="shark" alt="サメ右">
</div>

// かな列 → 「入力ユニット」の配列（各ユニットは候補パターンの配列）
function toUnits(yomi) {
  const units = [];
  let i = 0;
  while (i < yomi.length) {
    const c = yomi[i];
    // 促音「っ」: 次のユニットの先頭子音を重ねる
    if (c === "っ" && i + 1 < yomi.length) {
      let next, len = 1;
      const two = yomi.substr(i + 1, 2);
      if (COMBO[two]) { next = COMBO[two]; len = 2; }
      else { next = KANA[yomi[i + 1]] || [yomi[i + 1]]; }
      const cand = next.map(p => p[0] + p);
      // 「xtu」+ 次 でも入力可能にする
      units.push({ kana: c + yomi.substr(i + 1, len), pats: cand.concat(
        KANA["っ"].flatMap(t => next.map(p => t + p))) });
      i += 1 + len;
      continue;
    }
    // 拗音・外来音の結合
    const two = yomi.substr(i, 2);
    if (two.length === 2 && COMBO[two]) {
      units.push({ kana: two, pats: COMBO[two].slice() });
      i += 2; continue;
    }
    units.push({ kana: c, pats: (KANA[c] || [c]).slice() });
    i += 1;
  }
  return units;
}

let surpriseTimer = null;

const $ = id => document.getElementById(id);
const elLeft = $("shark-left"), elRight = $("shark-right");
elLeft.src = SHARK_NORMAL_SRC;
elRight.src = SHARK_NORMAL_SRC;

// ============================================================
// UI 更新
// ============================================================
function updateHeader() {
  const t = Math.max(0, timeLeft);
  $("time-fill").style.width = (t / MAX_TIME * 100) + "%";
  $("time-text").textContent = Math.ceil(t) + "秒";
  $("score").textContent = score;
}

function currentRemainStr() {
  // 現在ユニットの残り + 以降のユニットの第一候補
  let rest = "";
  if (unitIdx < units.length) {
    const pat = units[unitIdx].pats.find(p => p.startsWith(typedInUnit)) || units[unitIdx].pats[0];
    rest += pat.slice(typedInUnit.length);
    for (let k = unitIdx + 1; k < units.length; k++) rest += units[k].pats[0];
  }
  return rest;
}

function renderRomaji() {
  const done = doneStr + typedInUnit;
  $("romaji").innerHTML =
    '<span class="done">' + done + '</span><span class="rest">' + currentRemainStr() + '</span>';
}

function setMessage(html) {
  $("message").innerHTML = html;
  $("message").classList.remove("hidden");
}

// ============================================================
// 単語の出題
// ============================================================
function nextWord() {
  let idx;
  do { idx = Math.floor(Math.random() * WORDS.length); }
  while (idx === curWordIdx && WORDS.length > 1);
  curWordIdx = idx;
  const [disp, yomi] = WORDS[idx];
  units = toUnits(yomi);
  unitIdx = 0; typedInUnit = ""; doneStr = ""; missed = false;
  $("japanese").textContent = disp;
  renderRomaji();
}

// ============================================================
// サメの演出
// ============================================================
function surpriseSharks() {
  clearTimeout(surpriseTimer);
  elLeft.src = SHARK_SURPRISED_SRC;
  elRight.src = SHARK_SURPRISED_SRC;
  [elLeft, elRight].forEach(e => {
    e.classList.remove("bounce"); void e.offsetWidth; e.classList.add("bounce");
  });
  surpriseTimer = setTimeout(() => {
    elLeft.src = SHARK_NORMAL_SRC;
    elRight.src = SHARK_NORMAL_SRC;
    elLeft.classList.remove("bounce");
    elRight.classList.remove("bounce");
  }, SURPRISE_MS);
}

function showBonus() {
  const b = $("bonus");
  b.classList.remove("show"); void b.offsetWidth; b.classList.add("show");
}

function showPenalty() {
  const p = $("penalty");
  p.textContent = "-" + MISS_PENALTY + "秒";
  p.classList.remove("show"); void p.offsetWidth; p.classList.add("show");
}

// ============================================================
// タイピング処理
// ============================================================
function handleChar(ch) {
  const unit = units[unitIdx];
  const attempt = typedInUnit + ch;
  const matches = unit.pats.filter(p => p.startsWith(attempt));

  if (matches.length === 0) {
    // ミス
    missed = true;
    const r = $("romaji");
    r.classList.remove("miss"); void r.offsetWidth; r.classList.add("miss");
    timeLeft -= MISS_PENALTY;
    showPenalty();
    if (timeLeft <= 0) { timeLeft = 0; updateHeader(); gameOver(); return; }
    updateHeader();
    return;
  }

  // 正解の1文字
  typedInUnit = attempt;
  score += 1;

  // ユニット完了？
  if (unit.pats.includes(typedInUnit)) {
    // 他に長い候補が続く可能性がない場合のみ確定
    const longer = unit.pats.some(p => p.length > typedInUnit.length && p.startsWith(typedInUnit));
    if (!longer) {
      doneStr += typedInUnit;
      typedInUnit = "";
      unitIdx++;
    }
  }

  if (unitIdx >= units.length) {
    // 単語完了
    score += 5;
    if (!missed) {
      score += 5;
      timeLeft = Math.min(MAX_TIME, timeLeft + BONUS_TIME);
      showBonus();
    }
    surpriseSharks();
    nextWord();
  } else {
    renderRomaji();
  }
  updateHeader();
}

// ============================================================
// ゲーム進行
// ============================================================
function showReady() {
  state = "ready";
  $("game-view").classList.add("hidden");
  $("countdown").classList.add("hidden");
  setMessage('<div class="big">タイピングゲーム</div>スペースキーを押してスタート');
  timeLeft = INITIAL_TIME; score = 0;
  updateHeader();
}

function startCountdown() {
  state = "countdown";
  $("message").classList.add("hidden");
  $("game-view").classList.add("hidden");
  timeLeft = INITIAL_TIME; score = 0;
  updateHeader();
  const cd = $("countdown");
  cd.classList.remove("hidden");
  let n = 3;
  cd.textContent = n;
  const iv = setInterval(() => {
    n--;
    if (n > 0) { cd.textContent = n; }
    else { clearInterval(iv); cd.classList.add("hidden"); startGame(); }
  }, 1000);
}

function startGame() {
  state = "playing";
  $("game-view").classList.remove("hidden");
  nextWord();
  lastTick = performance.now();
  rafId = requestAnimationFrame(loop);
}

function loop(now) {
  if (state !== "playing") return;
  const dt = (now - lastTick) / 1000;
  lastTick = now;
  timeLeft -= dt;
  if (timeLeft <= 0) { timeLeft = 0; updateHeader(); gameOver(); return; }
  updateHeader();
  rafId = requestAnimationFrame(loop);
}

function gameOver() {
  state = "over";
  cancelAnimationFrame(rafId);
  $("game-view").classList.add("hidden");
  setMessage(
    '<div class="big">ゲームオーバー</div>' +
    '最終スコア: <b>' + score + '</b> 点<br>' +
    '<span class="sub">もう一度プレイ（スペースキー）</span>'
  );
}

// ============================================================
// キー入力
// ============================================================
window.addEventListener("keydown", e => {
  if (e.code === "Space") {
    e.preventDefault();
    if (state === "ready" || state === "over") startCountdown();
    return;
  }
  if (state !== "playing") return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key.length !== 1) return;
  e.preventDefault();
  handleChar(e.key.toLowerCase());
});

showReady();
</script>
</body>
</html>
