<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>どくろ神経衰弱</title>
<style>
  :root{
    --bg:#14162b; --panel:#22264a; --text:#f4f5ff;
    --p1:#4da3ff; --p2:#ff9f43; --danger:#ff5470;
    --card-back:linear-gradient(135deg,#6c5ce7,#a29bfe);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;
    min-height:100vh;display:flex;flex-direction:column;align-items:center;
    padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom)}
  .wrap{width:100%;max-width:460px;padding-bottom:70px}
  h1{font-size:1.2rem;text-align:center;margin:12px 0 8px}

  /* ステータス表示 */
  .status{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:stretch}
  .player{background:var(--panel);border-radius:14px;padding:8px;text-align:center;
    border:3px solid transparent;transition:.2s;opacity:.65}
  .player.active{opacity:1;transform:scale(1.04)}
  #p0.active{border-color:var(--p1)} #p1.active{border-color:var(--p2)}
  .player b{display:block;font-size:.85rem}
  #p0 b{color:var(--p1)} #p1 b{color:var(--p2)}
  .score{font-size:2rem;font-weight:800;line-height:1.1}
  .detail{font-size:.7rem;opacity:.8}
  .center{background:var(--panel);border-radius:14px;padding:8px;text-align:center;font-size:.72rem;
    display:flex;flex-direction:column;justify-content:center;gap:4px}
  .center strong{font-size:1.2rem;color:var(--danger)}

  /* カード盤面（列数は grid-template-columns で変更） */
  .board{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
  .card{aspect-ratio:3/4;perspective:600px;cursor:pointer;transition:opacity .4s,transform .4s;user-select:none}
  .card .inner{position:relative;width:100%;height:100%;transition:transform .4s;transform-style:preserve-3d}
  .card.flipped .inner{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;border-radius:12px;display:flex;align-items:center;justify-content:center;
    backface-visibility:hidden;-webkit-backface-visibility:hidden;font-size:clamp(1.6rem,9vw,2.6rem)}
  .back{background:var(--card-back);color:#ffffff88;box-shadow:0 3px 0 #0004}
  .front{background:#fff;transform:rotateY(180deg);box-shadow:0 3px 0 #0004}
  .trap .front{background:#2b0d18;box-shadow:0 0 12px var(--danger)}
  .gone{opacity:0;transform:scale(.6);pointer-events:none}
  .pop{animation:pop .5s}
  @keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}

  /* メッセージエリア */
  .msg{position:fixed;left:0;right:0;bottom:0;padding:14px 12px calc(14px + env(safe-area-inset-bottom));
    background:#0b0c1acc;backdrop-filter:blur(6px);text-align:center;font-weight:700}

  /* オーバーレイ */
  .overlay{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
  .overlay.hide{display:none}
  .modal{background:var(--panel);border-radius:18px;padding:24px;max-width:360px;text-align:center}
  .modal h2{margin-top:0} .modal p{font-size:.85rem;line-height:1.6;text-align:left}
  button{font:inherit;font-weight:800;color:#fff;background:var(--card-back);border:0;border-radius:12px;
    padding:14px 28px;font-size:1rem;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <h1>💀 どくろ神経衰弱 💀</h1>
  <div class="status">
    <div class="player" id="p0"><b>P1</b><div class="score" id="s0">0</div><div class="detail" id="d0"></div></div>
    <div class="center">どくろ追加数<strong id="traps">0</strong>次の追加まで<span id="next">-</span>手番</div>
    <div class="player" id="p1"><b>P2</b><div class="score" id="s1">0</div><div class="detail" id="d1"></div></div>
  </div>
  <div class="board" id="board"></div>
</div>
<div class="msg" id="msg">スタートを押してね</div>

<div class="overlay" id="startOv">
  <div class="modal">
    <h2>ルール</h2>
    <p>・2枚めくってペアを揃えるとポイント+1（揃えたら続けてOK）<br>
    ・2手番ごとに💀の罠カードが1枚、場に追加されます<br>
    ・💀を引くとマイナス1点でターン交代<br>
    ・全ペアが揃ったら終了。<br>スコア＝ペア数−罠のペナルティ</p>
    <button onclick="startGame()">スタート</button>
  </div>
</div>
<div class="overlay hide" id="endOv">
  <div class="modal"><h2 id="endTitle"></h2><p id="endText" style="text-align:center"></p>
    <button onclick="startGame()">もう一度遊ぶ</button></div>
</div>

<script>
/* ===== 設定（ここを変えるとルールをカスタマイズできます） ===== */
const EMOJIS = ["🍎","🍌","🍇","🍓","🐶","🐱","🐸","🐼","⚽","🎲","🚀","🌈"]; // 12種×2枚=24枚
const PENALTY = 1;          // どくろを引いたときの減点
const TRAP_EVERY = 2;       // 何手番ごとに罠を追加するか
const MISMATCH_DELAY = 900; // ハズレ時に裏に戻るまで(ms)
const TRAP_PEEK = 1300;     // 追加された罠を表向きで見せる時間(ms)
const CONTINUE_ON_MATCH = true; // ペア成功時に続けて同じ人が引くか
const RANDOM_INSERT = true; // true:罠を盤面のランダムな位置に挿入 / false:末尾に追加

/* ===== 状態 ===== */
const $ = s => document.querySelector(s);
const board = $("#board");
let players, cur, attempts, first, lock, matched, trapsAdded;

const shuffle = a => { for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const score = p => p.pairs - p.pen * PENALTY;
const setMsg = t => $("#msg").textContent = t;

function startGame(){
  players = [{pairs:0,pen:0},{pairs:0,pen:0}];
  cur = 0; attempts = 0; first = null; lock = false; matched = 0; trapsAdded = 0;
  board.innerHTML = "";
  shuffle([...EMOJIS, ...EMOJIS]).forEach(e => board.appendChild(makeCard(e, false)));
  $("#startOv").classList.add("hide"); $("#endOv").classList.add("hide");
  updateUI(); turnMsg();
}

function makeCard(emoji, trap){
  const el = document.createElement("div");
  el.className = "card" + (trap ? " trap" : "");
  el.dataset.emoji = emoji;
  if (trap) el.dataset.trap = "1";
  el.innerHTML = `<div class="inner"><div class="face back">？</div><div class="face front">${emoji}</div></div>`;
  el.addEventListener("click", () => onCard(el));
  return el;
}

function updateUI(){
  players.forEach((p,i)=>{
    $("#s"+i).textContent = score(p);
    $("#d"+i).textContent = `ペア ${p.pairs} / 罠 -${p.pen*PENALTY}`;
    $("#p"+i).classList.toggle("active", cur===i);
  });
  $("#traps").textContent = trapsAdded;
  $("#next").textContent = TRAP_EVERY - (attempts % TRAP_EVERY);
}
const turnMsg = () => setMsg(`P${cur+1} のターン！カードを2枚めくってね`);

/* ===== カードをめくる処理 ===== */
function onCard(el){
  if (lock || el.classList.contains("flipped") || el.classList.contains("gone")) return;
  el.classList.add("flipped");

  // どくろを引いた場合：減点・カード消滅・ターン交代
  if (el.dataset.trap){
    lock = true;
    players[cur].pen++;
    setMsg(`💀 P${cur+1} がどくろを引いた！ -${PENALTY}点`);
    updateUI();
    setTimeout(() => {
      el.classList.add("gone");
      if (first){ first.classList.remove("flipped"); first = null; }
      endAttempt(true);
    }, 1000);
    return;
  }

  if (!first){ first = el; return; }   // 1枚目

  // 2枚目：一致判定
  const a = first; first = null; lock = true;
  if (a.dataset.emoji === el.dataset.emoji){
    players[cur].pairs++; matched++;
    setMsg(`✨ ペア成功！ P${cur+1} +1点`); updateUI();
    setTimeout(() => { a.classList.add("gone"); el.classList.add("gone"); endAttempt(!CONTINUE_ON_MATCH); }, 700);
  } else {
    setMsg("ハズレ…");
    setTimeout(() => { a.classList.remove("flipped"); el.classList.remove("flipped"); endAttempt(true); }, MISMATCH_DELAY);
  }
}

/* ===== 1手番の終了処理 ===== */
function endAttempt(swap){
  attempts++;
  if (matched === EMOJIS.length){ updateUI(); return finish(); }
  if (swap) cur = 1 - cur;
  if (attempts % TRAP_EVERY === 0) addTrap();   // 2手番ごとに罠追加
  else { lock = false; turnMsg(); }
  updateUI();
}

function addTrap(){
  const t = makeCard("💀", true);
  t.classList.add("pop", "flipped");            // 追加時は表向き
  const kids = [...board.children];
  const ref = RANDOM_INSERT ? kids[Math.floor(Math.random()*(kids.length+1))] : null;
  board.insertBefore(t, ref || null);
  trapsAdded++; lock = true; updateUI();
  setMsg("💀 どくろカードが追加された！位置を覚えて…");
  setTimeout(() => { t.classList.remove("flipped"); lock = false; turnMsg(); }, TRAP_PEEK);
}

/* ===== ゲーム終了 ===== */
function finish(){
  const [a,b] = players.map(score);
  let title;
  if (a !== b) title = `🏆 P${a>b?1:2} の勝ち！`;
  else if (players[0].pairs !== players[1].pairs) title = `🏆 P${players[0].pairs>players[1].pairs?1:2} の勝ち！（同点→ペア数）`;
  else title = "🤝 引き分け！";
  $("#endTitle").textContent = title;
  $("#endText").innerHTML = `P1：${a}点（ペア${players[0].pairs} / 罠${players[0].pen}回）<br>P2：${b}点（ペア${players[1].pairs} / 罠${players[1].pen}回）`;
  setMsg("ゲーム終了！");
  setTimeout(() => $("#endOv").classList.remove("hide"), 800);
}
</script>
</body>
</html>
