<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小さなゲームセンター</title>
<style>
  :root {
    --bg-color: #f7f5ed;
    --text-color: #333333;
    --header-text: #2c3e50;
    --orange-btn: #f15a24;
    --card-radius: 20px;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
    background-color: var(--bg-color);
    background-image: 
      radial-gradient(#e0ddd0 1px, transparent 1px),
      radial-gradient(#e0ddd0 1px, #f7f5ed 1px);
    background-size: 40px 40px;
    background-position: 0 0, 20px 20px;
    color: var(--text-color);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    overflow-x: hidden;
  }

  /* 背景の装飾惑星 */
  .deco-planet {
    position: absolute;
    z-index: 0;
    pointer-events: none;
    opacity: 0.8;
  }
  .planet-right-top {
    top: 180px;
    right: -40px;
    width: 140px;
  }
  .planet-right-bottom {
    bottom: 80px;
    right: -30px;
    width: 160px;
  }

  /* ヘッダー */
  header {
    width: 100%;
    max-width: 1100px;
    padding: 20px 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: relative;
    z-index: 10;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
  }
  .logo-icon {
    width: 50px;
    height: 50px;
  }
  .logo-text {
    display: flex;
    flex-direction: column;
  }
  .logo-sub {
    font-size: 14px;
    font-weight: bold;
    color: #e74c3c;
    letter-spacing: 0.1em;
  }
  .logo-main {
    font-size: 26px;
    font-weight: 900;
    color: #2b3e50;
    line-height: 1.1;
  }

  /* ナビゲーション */
  nav {
    display: flex;
    align-items: center;
    gap: 25px;
  }
  nav a {
    text-decoration: none;
    color: #333;
    font-weight: 800;
    font-size: 15px;
    position: relative;
    letter-spacing: 0.05em;
  }
  nav a.active::after {
    content: "";
    position: absolute;
    bottom: -6px;
    left: 0;
    width: 100%;
    height: 3px;
    background-color: var(--orange-btn);
    border-radius: 2px;
  }

  /* ログインボタンエリア */
  .auth-box {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .btn-login {
    background-color: var(--orange-btn);
    color: #fff;
    padding: 10px 32px;
    border-radius: 25px;
    font-weight: bold;
    font-size: 16px;
    text-decoration: none;
    box-shadow: 0 4px 10px rgba(241, 90, 36, 0.3);
    transition: transform 0.2s, background-color 0.2s;
  }
  .btn-login:hover {
    background-color: #d84a1a;
    transform: translateY(-2px);
  }
  .new-account {
    font-size: 11px;
    color: #666;
    margin-top: 4px;
    text-decoration: none;
    font-weight: bold;
  }

  /* メインエリア */
  main {
    width: 100%;
    max-width: 800px;
    padding: 40px 20px 80px 20px;
    position: relative;
    z-index: 5;
  }

  .game-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 30px;
  }

  @media (max-width: 650px) {
    .game-grid {
      grid-template-columns: 1fr;
    }
  }

  /* ゲームカード共通スタイル */
  .card {
    border-radius: var(--card-radius);
    padding: 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    text-decoration: none;
    color: #fff;
    position: relative;
    box-shadow: 0 6px 16px rgba(0,0,0,0.12);
    transition: transform 0.25s ease, box-shadow 0.25s ease;
    min-height: 150px;
  }
  .card:hover {
    transform: translateY(-6px);
    box-shadow: 0 12px 24px rgba(0,0,0,0.2);
  }

  /* カードテーマカラー */
  .card-blue { background-color: #3b63a9; }
  .card-dark { background-color: #2d3748; }

  /* カード内部レイアウト */
  .card-img-box {
    width: 90px;
    height: 90px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255, 255, 255, 0.15);
    border-radius: 16px;
    padding: 8px;
  }
  .card-img-box svg, .card-img-box img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .card-content {
    flex-grow: 1;
    display: flex;
    flex-direction: column;
  }
  .card-category {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.08em;
    opacity: 0.9;
    text-transform: uppercase;
  }
  .card-title {
    font-size: 22px;
    font-weight: 900;
    margin: 4px 0;
    line-height: 1.2;
    text-shadow: 0 1px 3px rgba(0,0,0,0.3);
  }
  .card-desc {
    font-size: 11px;
    line-height: 1.4;
    opacity: 0.9;
    margin-top: 4px;
  }

  /* NEWバッジ */
  .badge-new {
    position: absolute;
    top: -12px;
    right: 20px;
    background-color: #e84c3d;
    color: #fff;
    font-size: 12px;
    font-weight: bold;
    padding: 4px 10px;
    border-radius: 12px;
    border: 2px solid #fff;
    box-shadow: 0 3px 6px rgba(0,0,0,0.2);
  }

  /* フッター */
  footer {
    width: 100%;
    background-color: #213547;
    color: #fff;
    padding: 18px 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: auto;
    font-size: 13px;
    font-weight: bold;
    z-index: 10;
  }
  .footer-links {
    display: flex;
    gap: 20px;
  }
  .footer-links a {
    color: #fff;
    text-decoration: none;
  }
  .footer-msg {
    color: #e0e0e0;
    font-size: 12px;
  }
</style>
</head>
<body>

  <!-- 背景デコレーション（惑星） -->
  <svg class="deco-planet planet-right-top" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="30" fill="#a1e3d8" />
    <ellipse cx="50" cy="50" rx="45" ry="10" fill="none" stroke="#7accc0" stroke-width="4" transform="rotate(-20 50 50)"/>
  </svg>

  <svg class="deco-planet planet-right-bottom" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="35" fill="#f1ab6c" />
    <ellipse cx="50" cy="50" rx="50" ry="12" fill="none" stroke="#d88d4e" stroke-width="5" transform="rotate(-15 50 50)"/>
  </svg>

  <!-- ヘッダー -->
  <header>
    <a href="#" class="logo">
      <svg class="logo-icon" viewBox="0 0 64 64">
        <path d="M52 12 C32 12 18 26 14 42 L22 50 C38 46 52 32 52 12 Z" fill="#e74c3c"/>
        <path d="M22 50 L10 54 L14 42 Z" fill="#f39c12"/>
        <circle cx="38" cy="26" r="6" fill="#ffffff"/>
        <circle cx="38" cy="26" r="3" fill="#3498db"/>
        <path d="M14 42 C8 44 4 52 4 52 C4 52 12 48 14 42 Z" fill="#e67e22"/>
      </svg>
      <div class="logo-text">
        <span class="logo-sub">小さな</span>
        <span class="logo-main">ゲームセンター</span>
      </div>
    </a>

    <nav>
      <a href="#" class="active">HOME</a>
      <a href="#">ALL GAMES</a>
      <a href="#">KIDS & BABIES</a>
      <a href="#">ABOUT</a>
    </nav>

    <div class="auth-box">
      <a href="#" class="btn-login">LOGIN</a>
      <a href="#" class="new-account">NEW ACCOUNT</a>
    </div>
  </header>

  <!-- ゲーム一覧（2つのみ） -->
  <main>
    <div class="game-grid">

      <!-- 1. タイピングshark! -->
      <a href="shark_typing.html" class="card card-blue">
        <div class="card-img-box">
          <svg viewBox="0 0 80 80">
            <!-- サメアイコン -->
            <path d="M10 45 C20 20, 50 15, 70 30 C55 35, 50 50, 40 55 C30 60, 15 55, 10 45 Z" fill="#60a5fa"/>
            <polygon points="35,30 45,15 48,32" fill="#3b82f6"/>
            <circle cx="58" cy="32" r="2.5" fill="#ffffff"/>
            <polygon points="50,42 54,42 52,46" fill="#ffffff"/>
            <polygon points="44,43 48,43 46,47" fill="#ffffff"/>
          </svg>
        </div>
        <div class="card-content">
          <span class="card-category">TYPING GAME</span>
          <h2 class="card-title">タイピングshark!</h2>
          <p class="card-desc">迫り来るサメをタイピングで撃退しよう！</p>
        </div>
      </a>

      <!-- 2. どくろ神経衰弱 (NEW) -->
      <a href="skull_memory.html" class="card card-dark">
        <span class="badge-new">NEW</span>
        <div class="card-img-box">
          <svg viewBox="0 0 80 80">
            <!-- どくろアイコン -->
            <path d="M25 35 C25 20, 55 20, 55 35 C55 45, 50 48, 50 52 L30 52 C30 48, 25 45, 25 35 Z" fill="#f8fafc"/>
            <circle cx="33" cy="35" r="5" fill="#0f172a"/>
            <circle cx="47" cy="35" r="5" fill="#0f172a"/>
            <polygon points="40,40 37,45 43,45" fill="#0f172a"/>
            <line x1="35" y1="52" x2="35" y2="48" stroke="#0f172a" stroke-width="2"/>
            <line x1="40" y1="52" x2="40" y2="48" stroke="#0f172a" stroke-width="2"/>
            <line x1="45" y1="52" x2="45" y2="48" stroke="#0f172a" stroke-width="2"/>
          </svg>
        </div>
        <div class="card-content">
          <span class="card-category">MEMORY GAME</span>
          <h2 class="card-title">どくろ神経衰弱</h2>
          <p class="card-desc">カードをめくって同じどくろペアを揃えよう！</p>
        </div>
      </a>

    </div>
  </main>

  <!-- フッター -->
  <footer>
    <div class="footer-links">
      <a href="#">HOW TO PLAY</a>
      <a href="#">PRIVACY</a>
    </div>
    <div class="footer-msg">
      NEW GAMES ADDED EVERY MONTH! Follow our creation story!
    </div>
  </footer>

</body>
</html>
